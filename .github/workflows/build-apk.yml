name: 📱 Build & Release Android APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'GitHub Release에 APK를 공식 배포할까요?'
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-android-apk:
    name: 🚀 Build RUTI Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 3. Install NPM Dependencies
        run: npm ci || npm install

      - name: 4. Build Production Web Assets
        run: npm run build

      - name: 5. Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: 6. Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: 7. Sync Capacitor Android Platform
        run: npx cap sync android

      - name: 8. Build Debug APK with Gradle
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: 9. Rename APK for Clarity
        run: |
          mkdir -p release-output
          cp android/app/build/outputs/apk/debug/app-debug.apk release-output/RUTI-Workout-Diary.apk

      - name: 10. Upload APK Artifact (Direct Download via Actions)
        uses: actions/upload-artifact@v4
        with:
          name: RUTI-Android-APK
          path: release-output/RUTI-Workout-Diary.apk
          retention-days: 30

      - name: 11. Create GitHub Release & Attach APK
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: release-output/RUTI-Workout-Diary.apk
          tag_name: ${{ github.ref_name || 'v1.0.0-latest' }}
          name: "RUTI Android App ${{ github.ref_name || 'Latest' }}"
          body: |
            ## 🏋️ RUTI 스마트 운동 일지 & 다꾸 웹앱
            - **클린 애슬레틱 UI** 전면 리뉴얼
            - 인터랙티브 운동일지 꾸미기 & 스티커/사진/메모
            - 오프라인 지원 및 인스타그램 스토리 공유
            
            ### 📲 다운로드 및 설치:
            하단의 **`RUTI-Workout-Diary.apk`**를 스마트폰에서 다운로드하여 설치하세요.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
