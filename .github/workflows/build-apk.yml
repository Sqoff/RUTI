name: 📱 Build & Release Android APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: 🚀 Build RUTI APK
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 3. Install Dependencies
        run: npm ci || npm install

      - name: 4. Build Production Web Assets
        run: npm run build

      - name: 5. Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21

      - name: 6. Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: 7. Sync Capacitor Android
        run: npx cap sync android

      - name: 8. Build Debug APK with Gradle
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: 9. Prepare Release APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ./RUTI-Workout-Diary.apk

      - name: 10. Upload APK Artifact (Actions)
        uses: actions/upload-artifact@v4
        with:
          name: RUTI-Android-APK
          path: ./RUTI-Workout-Diary.apk
          retention-days: 30

      - name: 11. Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: ./RUTI-Workout-Diary.apk
          tag_name: ${{ github.ref_name == 'main' && 'v1.0.0' || github.ref_name }}
          name: "RUTI Android App v1.0.0 (오운완 다꾸 에디션)"
          body: |
            ## 🏋️ RUTI — 스마트 운동 일지 & 다꾸 웹앱 (Android v1.0.0)

            프로페셔널 웨이트 트레이닝 기록과 감성 다이어리 꾸미기를 결합한 스마트 피트니스 저널입니다.

            ### ✨ 주요 기능
            - **⚡ 클린 애슬레틱 UI**: 나이키 & 애플 피트니스 감성의 다크 테마
            - **🎨 60fps 인터랙티브 다꾸 엔진**: 터치 드래그, 회전, 스케일, 복제, 반전, 레이어 순서 조절
            - **🏋️ 스마트 세트 빌더**: 부위/종목 즐겨찾기(⭐), 원터치 [빈봉] 모드
            - **📸 1080px WebP 압축**: 10MB 원본 ➔ 150KB 98% 압축으로 렉 없는 무제한 로컬 저장
            - **🔥 오운완 인스타 스토리 딥링크**: 1초 만에 인스타 스토리로 캡처 전송
            - **⏱️ 실시간 세트 타이머 & 눈바디 슬라이더 & 성장 통계 차트**

            ---
            ### 📲 설치 파일 다운로드:
            하단의 **`RUTI-Workout-Diary.apk`**를 스마트폰에서 바로 다운로드하여 설치하세요!
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
